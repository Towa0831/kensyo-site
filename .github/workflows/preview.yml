name: 確認用ページを更新

# Claudeが下書きを保存したら、Claudeの処理（claude.yml）から呼び出されます。
# 下書きの内容で確認用ページを作って GitHub Pages に公開し、
# そのURLをIssue（公開申請があればそちら）にコメントします。
# 確認用ページは1つだけです。最後に作った下書きの内容が表示されます。
# Actions タブの「Run workflow」で、下書き（ブランチ）を選んで手動でも動かせます。
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: リポジトリのファイルを取り出す
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pythonを準備する
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 必要な部品をインストールする
        run: pip install -r requirements.txt

      - name: 確認用ページを生成する
        run: python build.py --preview

      - name: 確認用ページを準備する
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: 確認用ページを公開する（GitHub Pages）
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 確認用ページのURLを知らせる
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          PAGE_URL="${PAGE_URL%/}/"

          # 知らせる先：この下書きの公開申請があればそこ、なければ元のIssue
          PR="$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          ISSUE="$(echo "$BRANCH" | sed -nE 's#^claude/issue-([0-9]+)-.*#\1#p')"
          TARGET="${PR:-$ISSUE}"
          if [ -z "$TARGET" ]; then
            echo "知らせる先が見つからないため、コメントはしません。確認用ページ: $PAGE_URL"
            exit 0
          fi

          # 変更したお知らせ・求人のページ（非公開にしたものは、表示されないことを書く）
          git fetch --quiet origin main
          PAGES=""
          for f in $(git diff --name-only origin/main...HEAD -- content/news content/jobs); do
            case "$f" in
              content/news/*.md) KIND="お知らせ"; DIR="news" ;;
              content/jobs/*.md) KIND="求人"; DIR="jobs" ;;
              *) continue ;;
            esac
            NAME="$(basename "$f" .md)"
            TITLE=""
            if [ -f "$f" ]; then TITLE="$(sed -n 's/^title:[[:space:]]*//p' "$f" | head -n 1)"; fi
            LABEL="${KIND}${TITLE:+『$TITLE』}"
            if [ -f "dist/$DIR/$NAME.html" ]; then
              PAGES="$PAGES"$'\n'"- ${LABEL}: ${PAGE_URL}${DIR}/${NAME}.html"
            else
              PAGES="$PAGES"$'\n'"- ${LABEL}: 非公開（または掲載終了）のため表示されません。一覧から消えていれば正しい状態です"
            fi
          done

          {
            echo "### 確認用ページを更新しました"
            echo ""
            echo "- トップページ: ${PAGE_URL}"
            echo "- お知らせ一覧: ${PAGE_URL}news/index.html"
            if [ -n "$PAGES" ]; then echo "${PAGES#$'\n'}"; fi
            echo ""
            echo "表示が変わっていなければ、ページを再読み込みしてください（反映に1分ほどかかることがあります）。"
            echo "確認用ページは1つだけなので、ほかの下書きを保存すると、その内容に置き換わります。"
          } > comment.md
          gh api "repos/$REPO/issues/$TARGET/comments" -F body=@comment.md > /dev/null
          echo "#$TARGET に確認用ページのURLを知らせました: $PAGE_URL"
