# サイト全体の設定（会社情報・トップページの文章など）
# ここを書き換えると、すべてのページに反映されます。

# 会社名（ヘッダー・フッター・ページのタイトルに表示）
name: サンプル株式会社

# トップページの大きな見出し
tagline: 地域の暮らしを、もっと心地よく。

# 検索結果などに表示される、サイトの説明文
description: サンプル株式会社の公式サイトです。最新のお知らせと採用情報を掲載しています。

# トップページの紹介文
about: |
  サンプル株式会社は、地域のお客様の暮らしを支えるサービスを提供しています。
  ※この文章はサンプルです。実際の会社紹介に書き換えてください。

# トップページの画像（空欄なら画像なし）。images/site/ に置いた画像を指定する
hero_image:
hero_image_alt:

# 採用情報ページの説明文
jobs_lead: 現在募集している職種です。気になる職種があれば、お気軽にお問い合わせください。

# 会社概要（左が項目名、右が内容）
company:
  - [会社名, サンプル株式会社]
  - [所在地, "〒000-0000 ○○県○○市○○町1-2-3"]
  - [設立, 2000年4月]
  - [代表者, 代表取締役 山田 太郎]
  - [事業内容, ○○事業、△△事業]

# お問い合わせ先（トップページ・フッターに表示）
contact:
  tel: 000-000-0000
  email: info@example.com
  hours: 平日 9:00〜18:00

# 応募先（求人ページに表示）
recruit_contact:
  tel: 000-000-0000
  email: recruit@example.com
  person: 採用担当
